ext.GCSEE_VERSION = "0.2.0"

dependencies {
    implementation project(path: ':binjr-adapter-logs')
    compileOnly project(':binjr-core')

    implementation("com.kodewerk.gcsee:gcsee-api:${GCSEE_VERSION}")
    implementation("com.kodewerk.gcsee:gcsee-parser:${GCSEE_VERSION}")
    implementation("com.kodewerk.gcsee:gcsee-vertx:${GCSEE_VERSION}")
}

jar {
    manifest {
        attributes(
                'Specification-Title': project.name,
                'Specification-Version': project.version,
                'Implementation-Title': project.name,
                'Implementation-Version': project.version,
                'Build-Number': BINJR_BUILD_NUMBER
        )
    }
}