vm.heapsize.preferred = 4096
; --- Setup Garbage Collector ---
vmarg.1 = -XX:+UseG1GC
vmarg.2 = -XX:G1PeriodicGCInterval=5000
vmarg.3 = -XX:+G1PeriodicGCInvokesConcurrent
vmarg.4 = -XX:G1PeriodicGCSystemLoadThreshold=0.0
vmarg.5 = -XX:MaxHeapFreeRatio=10
vmarg.6 = -XX:MinHeapFreeRatio=10
; --- Enable Compact Object Headers ---
vmarg.7 = -XX:+UseCompactObjectHeaders
; --- Module exports ---
vmarg.8 = --add-exports=javafx.base/com.sun.javafx.event=ALL-UNNAMED
vmarg.9 = --add-exports=javafx.controls/com.sun.javafx.charts=ALL-UNNAMED
vmarg.10 =  --add-opens=javafx.graphics/javafx.geometry=ALL-UNNAMED
vmarg.11 = --add-opens=javafx.graphics/com.sun.javafx.scene=ALL-UNNAMED
vmarg.12 = --add-opens=javafx.graphics/com.sun.javafx.scene.traversal=ALL-UNNAMED
vmarg.13 = --add-opens=javafx.graphics/javafx.scene.paint=ALL-UNNAMED
vmarg.14 = --enable-native-access=javafx.graphics,ALL-UNNAMED
vmarg.15 = --add-modules=jdk.incubator.vector
; --- Application Packaging ---
arg.1 = --packaging=WIN_MSI
; --- System Plugins Path (absolute or relative to binjr-core.jar) ---
arg.2 = --system-plugins-path=../plugins